[package]
name = "search_sni"
edition = "2024"
version.workspace = true

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = true

[build-dependencies]
cc = { version = "1.0", features = ["parallel"] }
which = { version = "6.0" }

[dependencies]
clap = { version = "4.0", features = ["derive"] }
nix = { version = "0.29", features = ["signal"] }
libafl = { path = "../../vendors/LibAFL/libafl/" }
libafl_bolts = { path = "../../vendors/LibAFL/libafl_bolts/" }
libafl_cc = { path = "../../vendors/LibAFL/libafl_cc/" }
libafl_targets = { path = "../../vendors/LibAFL/libafl_targets/", features = ["sancov_pcguard_hitcounts", "libfuzzer", "pointer_maps"] }
log = "0.4.21"
env_logger = "0.11"
mylibafl = { path = "../../libafl-modules/" }
rand = "0.9.0-alpha.0"
ring = "0.17"
ctrlc = "3.1.0"
regex = { version = "1", optional = true }
serde = { version = "1.0.196", features = ["derive"] }
serde_json = "1.0.114"
ahash = "0.8.11"
chrono = "0.4.37"
byteorder = "1.5.0"
libc = "0.2"
libm = "0.2"
slab = "0.4"
once_cell = "1"
octets = { version = "0.3", path = "../../vendors/quiche/octets" }
boring = { version = "4", optional = true }
foreign-types-shared = { version = "0.3.0", optional = true }
intrusive-collections = "0.9.5"
qlog = { path = "../../vendors/quiche/qlog", optional = true }
h3i = {path = "../../vendors/quiche/h3i"}
sfv = { version = "0.9", optional = true }
smallvec = { version = "1.10", features = ["serde", "union"] }
quiche = {path = "../../vendors/quiche/quiche"}
url = "2.5"
mio = { version = "0.8", features = ["net", "os-poll"] }
winapi = { version = "0.3", features = ["wincrypt", "ws2def", "ws2ipdef", "ws2tcpip"] }
hashbrown = { version = "0.14", features = ["serde", "ahash"], default-features = false } # A faster hashmap, nostd compatible
num-traits = "0.2"
bitflags = "1.3.2"
bincode = "1.3"  # 或者其它你需要的版本
docopt = "1"
